<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Добавить в календарь · Trustmont Capital × Wyndham</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,500;1,400&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#171D3E;--card:#1D2550;--fg:#F4EFE7;--muted:#B3B4C4;--copper:#DCA77B;--line:rgba(244,239,231,.12)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#27232D,#171D3E);color:var(--fg);font:16px/1.5 Manrope,system-ui,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 24px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--copper);font-weight:700}
h1{font:500 clamp(24px,6vw,30px)/1.15 "Noto Serif Display",serif;margin:10px 0 6px}
h1 em{color:var(--copper)}
.when{color:var(--muted);margin:0 0 22px}
.btns{display:grid;gap:10px}
a.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;text-decoration:none;font-weight:700;color:var(--fg);border:1px solid var(--line);background:rgba(255,255,255,.04)}
a.btn.main{background:linear-gradient(90deg,#E3B189,#C88F61);color:#1b1630;border:0}
.note{font-size:13px;color:var(--muted);margin:18px 0 0;text-align:center}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="eyebrow">Онлайн-вебинар · Trustmont Capital</div>
    <h1>Отельная недвижимость: прямой разговор с <em>Wyndham Hotels &amp; Resorts</em></h1>
    <p class="when">14 ноября 2026 · 11:00 по Киеву · 1 час</p>
    <div class="btns">
      <a class="btn" id="b-apple" href="wyndham-webinar-2026-11-14.ics">iPhone / Mac (Apple Календарь)</a>
      <a class="btn" id="b-google" href="#" target="_blank" rel="noopener">Google Календарь / Android</a>
      <a class="btn" id="b-outlook" href="#" target="_blank" rel="noopener">Outlook</a>
    </div>
    <p class="note">Календарь напомнит за час и за 5 минут до начала. Ссылка на эфир придёт в Telegram-бот.</p>
  </div>
</main>
<script>
(function(){
  var t='Отельная недвижимость: прямой разговор с Wyndham Hotels & Resorts',
      d='Как международные гостиничные сети выбирают проекты, контролируют качество и за что на самом деле отвечают перед инвесторами?\n\nСсылка на вебинар придёт в Telegram-бот: https://t.me/trustmont_capital_bot',
      loc='https://t.me/trustmont_capital_bot', e=encodeURIComponent;
  var g='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+e(t)+'&dates=20261114T090000Z/20261114T100000Z&details='+e(d)+'&location='+e(loc)+'&ctz=Europe/Kyiv';
  var o='https://outlook.live.com/calendar/0/deeplink/compose?path=/calendar/action/compose&rru=addevent&subject='+e(t)+'&startdt=2026-11-14T09:00:00Z&enddt=2026-11-14T10:00:00Z&body='+e(d)+'&location='+e(loc);
  document.getElementById('b-google').href=g; document.getElementById('b-outlook').href=o;
  var ics=document.getElementById('b-apple');
  ics.href=new URL('wyndham-webinar-2026-11-14.ics',location.href.replace(/\/?([?#].*)?$/,'/')).href;
  /* straight into the right calendar: iPhone/iPad opens the event with «Добавить», Android opens Google Calendar; computers pick a button */
  var ua=navigator.userAgent, ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios) location.href=ics.href; else if(/Android/.test(ua)) location.href=g;
})();
</script>
</body>
</html>
